<!DOCTYPE html>
<html>
  <head><title>My Page</title></head>
  <body>
    <script>
       function minMax(nums) {
        if (nums.length === 0) {
            return {
            min: null,
            max: null
            };
        }

        let min = nums[0];
        let max = nums[0];

        for (let i = 1; i < nums.length; i++) {
            if (nums[i] < min) {
            min = nums[i];
            }

            if (nums[i] > max) {
            max = nums[i];
            }
        }

        return {
            min: min,
            max: max
        };
        }

        console.log(minMax([]));
        console.log(minMax([3]));
        console.log(minMax([1, -3, 5]));
    </script>
  </body>
