<!DOCTYPE html>
<html>
  <head>
    <title>10b - Uber Buttons</title>

    <style>
      .request-button {
        background-color: black;
        color: white;
        border: none;
        padding: 12px 25px;
        font-weight: bold;
        cursor: pointer;
      }

      .schedule-button {
        background-color: rgb(230, 230, 230);
        color: black;
        border: none;
        padding: 12px 25px;
        font-weight: bold;
        margin-left: 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <button class="request-button">
      Request now
    </button>

    <button class="schedule-button">
      Schedule for later
    </button>
  </body>
</html>
