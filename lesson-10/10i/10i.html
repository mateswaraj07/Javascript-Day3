<!DOCTYPE html>
<html>
  <head>
    <title>10i - Calculator</title>

    <link rel="stylesheet" href="10i.css">
  </head>

  <body>

    <div class="calculator">

      <div class="calculation"></div>

      <div class="buttons">

        <button class="number-button"
          onclick="updateCalculation('1');">
          1
        </button>

        <button class="number-button"
          onclick="updateCalculation('2');">
          2
        </button>

        <button class="number-button"
          onclick="updateCalculation('3');">
          3
        </button>

        <button class="operator-button"
          onclick="updateCalculation(' + ');">
          +
        </button>

        <button class="number-button"
          onclick="updateCalculation('4');">
          4
        </button>

        <button class="number-button"
          onclick="updateCalculation('5');">
          5
        </button>

        <button class="number-button"
          onclick="updateCalculation('6');">
          6
        </button>

        <button class="operator-button"
          onclick="updateCalculation(' - ');">
          -
        </button>

        <button class="number-button"
          onclick="updateCalculation('7');">
          7
        </button>

        <button class="number-button"
          onclick="updateCalculation('8');">
          8
        </button>

        <button class="number-button"
          onclick="updateCalculation('9');">
          9
        </button>

        <button class="operator-button"
          onclick="updateCalculation(' * ');">
          *
        </button>

        <button class="number-button"
          onclick="updateCalculation('0');">
          0
        </button>

        <button class="number-button"
          onclick="updateCalculation('.');">
          .
        </button>

        <button class="number-button"
          onclick="
            calculation = eval(calculation);
            saveCalculation();
            displayCalculation();
          ">
          =
        </button>

        <button class="operator-button"
          onclick="updateCalculation(' / ');">
          /
        </button>

        <button class="clear-button"
          onclick="
            calculation = '';
            saveCalculation();
            displayCalculation();
          ">
          Clear
        </button>

      </div>

    </div>

    <script src="10i.js"></script>
  </body>
</html>
