<!DOCTYPE html>
<html>
  <head>
    <title>10d - Gaming Button</title>

    <style>
      .gaming-button {
        background-color: black;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }

      .is-toggled {
        background-color: rgb(230, 230, 230);
        color: black;
      }
    </style>
  </head>

  <body>
    <button class="gaming-button">
      Gaming
    </button>

    <script>
      const button = document.querySelector('.gaming-button');

      button.addEventListener('click', function() {
        if (button.classList.contains('is-toggled')) {
          button.classList.remove('is-toggled');
        } else {
          button.classList.add('is-toggled');
        }
      });
    </script>
  </body>
</html>
